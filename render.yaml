# Configuração para o Render (render.com).
# No painel do Render: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: next-suplementos
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Chave da IA do chat (veja chat.js). O Render pede o valor na
      # criação; nunca coloque a chave escrita aqui no arquivo.
      - key: AI_API_KEY
        sync: false
